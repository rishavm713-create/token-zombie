name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: python3 alias (Windows ships python only; TZ itself uses bin/tzpy)
        if: runner.os == 'Windows'
        run: d="$(dirname "$(command -v python)")"; [ -e "$d/python3.exe" ] || cp "$d/python.exe" "$d/python3.exe"; python3 --version
      - run: bash tests/run_all.sh
