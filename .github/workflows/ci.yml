name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/v21/test_matrix.py extracts the v0.4.0 baseline with git archive; a shallow clone has no tags
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: python3 alias (Windows ships python only; TZ itself uses bin/tzpy)
        if: runner.os == 'Windows'
        run: d="$(dirname "$(command -v python)")"; [ -e "$d/python3.exe" ] || cp "$d/python.exe" "$d/python3.exe"; python3 --version
      - name: fake-HOME support for tests (Windows Python reads USERPROFILE, tests set HOME to a temp dir)
        if: runner.os == 'Windows'
        run: |
          sp="$(python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          printf '%s\n' "import os,sys; h=os.environ.get('HOME'); h and os.environ.__setitem__('USERPROFILE', h); [s.reconfigure(newline='\\n') for s in (sys.stdout, sys.stderr) if hasattr(s, 'reconfigure')]" > "$sp/tz_test_home.pth"
          # bin/tzpy tries `py -3` first, which may be another Python: give it the same shim
          sp3="$(py -3 -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])' 2>/dev/null | tr -d '\r')"
          if [ -n "$sp3" ] && [ "$sp3" != "$sp" ]; then mkdir -p "$sp3"; cp "$sp/tz_test_home.pth" "$sp3/"; fi
          # temp dirs as D:/... so paths inside python -c strings resolve on Windows Python
          mkdir -p "$RUNNER_TEMP/tzt"; echo "TMPDIR=$(cygpath -m "$RUNNER_TEMP/tzt")" >> "$GITHUB_ENV"
          python -I -c "import os;print('USERPROFILE follows HOME:', os.environ.get('USERPROFILE'))"
      - run: bash tests/run_all.sh
