name: clones
# Daily: save GitHub's 14-day clone data into docs/clones.json (running total), then redeploy the site.
# Needs repo secret TRAFFIC_TOKEN: a fine-grained token for this repo with "Administration: read".
on:
  schedule: [{cron: '17 3 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: gh api repos/${{ github.repository }}/traffic/clones | python3 .github/scripts/clones.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/clones.json docs/clones-badge.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update clone count"
          git push
          gh workflow run pages.yml
